<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LongX Vaults · 池子监控</title>
<style>
:root{
  --bg:#0a0a0b;--panel:#131316;--panel2:#1a1a1f;--line:#26262c;
  --fg:#e8e8ea;--dim:#8b8b94;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--gold:#f59e0b;
  /* 图表系列色:dataviz 参考调色板 dark 槽位(整组已校验;本站表面更暗,每卡单系列) */
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:10;background:rgba(10,10,11,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:16px;margin:0}
h1 span{color:var(--gold)}
.back{color:var(--dim);font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:8px}
.back:hover{color:var(--fg);border-color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
.dot.bad{background:var(--red)}
#meta{color:var(--dim);font-size:12px;margin-left:auto}
main{max-width:1240px;margin:0 auto;padding:12px 12px 40px}
/* 总览条 */
#sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:150px}
.tile .lb{color:var(--dim);font-size:11px;margin-bottom:3px}
.tile .v{font-size:20px;font-weight:600}
.tile .d{font-size:11px;margin-top:2px}
/* 过滤行:一行,位于图表区之上 */
#filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select,button{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:5px 9px;font-size:12px;outline:none;cursor:pointer}
button.on{border-color:var(--blue);color:#bad4fb}
/* vault 卡片网格 */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card.refetch{opacity:.55}          /* 重取数据时保留旧渲染,只降透明度 */
.chead{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.cdot{width:10px;height:10px;border-radius:3px;flex-shrink:0;align-self:center}
.tick{font-size:15px;font-weight:700}
.cname{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdg{padding:0 5px;border-radius:6px;font-size:10px;font-weight:700;flex-shrink:0}
.bdg.pause{color:#ffb84d;border:1px solid #ffb84d55;background:#ffb84d14}
.bdg.wind{color:#ff5d5d;border:1px solid #ff5d5d55;background:#ff5d5d14}
/* 指标行 */
.stat{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;font-size:12px}
.stat .k{color:var(--dim)}
.stat .v{font-variant-numeric:tabular-nums}
.d24{font-size:11px}
.d24.up{color:var(--green)}
.d24.dn{color:var(--red)}
.d24.fl{color:var(--dim)}
/* 容量进度条 */
.meter{height:5px;border-radius:3px;background:rgba(57,135,229,.16);margin:6px 0 2px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--s1)}
/* 图表 */
.chartwrap{position:relative;margin-top:8px}
svg{display:block;width:100%;height:auto}
.tt{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:5px 8px;font-size:11.5px;display:none;z-index:5;white-space:nowrap;
  box-shadow:0 4px 14px rgba(0,0,0,.5)}
.tt b{font-variant-numeric:tabular-nums;display:block}
.tt span{color:var(--dim);font-size:10.5px}
/* 表格视图 */
.tv{max-height:230px;overflow-y:auto;margin-top:8px;scrollbar-width:thin}
.tv table{width:100%;border-collapse:collapse;font-size:11.5px}
.tv td{padding:3px 4px;border-bottom:1px solid #1d1d23}
.tv td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tv td:first-child{color:var(--dim)}
.empty{color:var(--dim);text-align:center;padding:26px 0;font-size:12px}
@media (prefers-color-scheme: light){ :root{ --bg:#fafafa } }
</style>
</head>
<body>
<header>
  <h1><span>LONG</span>X Vaults · 池子监控</h1>
  <a class="back" href="/">← meme 看板</a>
  <div id="meta"><span class="dot" id="dot"></span><span id="status">加载中…</span></div>
</header>
<main>
  <div id="sum"></div>
  <div id="filters">
    <select id="metric" title="图表指标">
      <option value="tvl">TVL(总锁仓)</option>
      <option value="supply">资金量 supply(mint/redeem)</option>
      <option value="cap">容量上限 cap(平台扩缩容)</option>
      <option value="liq">交易池深度(流动性)</option>
    </select>
    <select id="range" title="时间范围">
      <option value="0">全部</option>
      <option value="86400">最近 24 小时</option>
      <option value="604800">最近 7 天</option>
      <option value="2592000">最近 30 天</option>
    </select>
    <button id="viewChart" class="on">📈 图表</button>
    <button id="viewTable">🔢 数据表</button>
  </div>
  <div id="grid"><div class="empty">正在加载 LongX 数据…</div></div>
</main>

<script>
"use strict";
/* ---------- 工具(与主看板一致的口径) ---------- */
const esc = s => (s??"").toString().replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const fmtUsd = v => v==null ? "—" :
  v>=1e9 ? "$"+(v/1e9).toFixed(2)+"B" :
  v>=1e6 ? "$"+(v/1e6).toFixed(2)+"M" :
  v>=1e3 ? "$"+(v/1e3).toFixed(1)+"K" : "$"+(+v).toFixed(2);
const fmtNum = v => v==null ? "—" :
  v>=1e9 ? (v/1e9).toFixed(2)+"B" :
  v>=1e6 ? (v/1e6).toFixed(2)+"M" :
  v>=1e3 ? (v/1e3).toFixed(1)+"K" : (+v).toFixed(0);
const ago = ts => { const s=Date.now()/1e3-ts;
  return s<60?Math.floor(s)+"秒":s<3600?Math.floor(s/60)+"分":s<86400?Math.floor(s/3600)+"时":Math.floor(s/86400)+"天"; };
const pad2 = n => String(n).padStart(2,"0");
const fmtT = ts => { const d=new Date(ts*1e3);
  return pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes()); };

/* 指标定义:label / 取值 / 格式化 / d24 键(history 行结构 [ts,tvl,supply,cap,liq]) */
const METRICS = {
  tvl:  {label:"TVL",     ix:1, fmt:fmtUsd, usd:true },
  supply:{label:"资金量", ix:2, fmt:fmtNum, usd:false},
  cap:  {label:"容量上限", ix:3, fmt:fmtUsd, usd:true },
  liq:  {label:"池深度",  ix:4, fmt:fmtNum, usd:false},
};
/* 固定槽位系列色(色随 vault,不随排序;vault 顺序按地址稳定排序) */
const SLOTS = ["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)","var(--s8)"];

/* ---------- 状态 ---------- */
const S = {metric:"tvl", range:0, table:false, data:null, lastJson:""};

/* ---------- 折线图(SVG,单系列 + 2px 线 + 端点 8px 圆点 + 十字线 tooltip) ---------- */
function niceTicks(lo, hi, n){
  const span = hi-lo || Math.abs(hi)||1, step0 = span/n;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0) || mag*10;
  const start = Math.ceil(lo/step)*step, out=[];
  for(let v=start; v<=hi+1e-9; v+=step) out.push(v);
  return {ticks:out, step};
}
function chartSVG(rows, M, color, capVal){
  const W=340, H=150, L=48, R=12, T=10, B=22;
  const xs = rows.map(r=>r[0]), vs = rows.map(r=>r[M.ix]);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  if(M.usd && capVal!=null){ lo=Math.min(lo,capVal); hi=Math.max(hi,capVal); }  // cap 参考线入界
  if(hi===lo){ hi=lo+1; lo=lo-1; }
  const pad=(hi-lo)*.08; lo-=pad; hi+=pad;
  const t0=xs[0], t1=xs[xs.length-1]||t0+1;
  const X = t => L+(R-L)*((t-t0)/((t1-t0)||1));
  const Y = v => T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const {ticks} = niceTicks(lo, hi, 3);
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">`;
  for(const t of ticks){
    const y=Y(t);
    s += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${L-6}" y="${y+3.5}" text-anchor="end" font-size="11" fill="var(--dim)">${esc(M.fmt(t))}</text>`;
  }
  /* X 轴时间标签(约 4 个) */
  const nx=4;
  for(let i=0;i<=nx;i++){
    const t=t0+(t1-t0)*i/nx, x=X(t);
    const d=new Date(t*1e3), short=(t1-t0)<172800
      ? pad2(d.getHours())+":"+pad2(d.getMinutes()) : pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
    s += `<text x="${x}" y="${H-6}" text-anchor="${i===0?"start":i===nx?"end":"middle"}" font-size="11" fill="var(--dim)">${short}</text>`;
  }
  /* cap 参考线(虚线:阈值语义,非网格) */
  if(M.usd && capVal!=null && capVal>=lo && capVal<=hi){
    const y=Y(capVal);
    s += `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>`;
    s += `<text x="${W-R-2}" y="${y-4}" text-anchor="end" font-size="10" fill="var(--dim)">cap</text>`;
  }
  /* 数据线 */
  if(rows.length>1){
    let path="";
    rows.forEach((r,i)=>{ path += (i?"L":"M")+X(r[0]).toFixed(1)+","+Y(r[M.ix]).toFixed(1); });
    s += `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  /* 端点圆点:≥8px + 2px 表面环 */
  const last=rows[rows.length-1];
  s += `<circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[M.ix]).toFixed(1)}" r="4" fill="${color}" stroke="var(--panel)" stroke-width="2"/>`;
  s += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)" stroke-width="1"/>`;
  s += `</svg>`;
  return {svg:s, X, Y, L, R, T, B, W, H, t0, t1};
}
/* 十字线 + tooltip(命中区=整个绘图区,取最近 X) */
function attachHover(wrap, geo, rows, M){
  const svgEl = wrap.querySelector("svg"), tt = wrap.querySelector(".tt");
  const cross = document.createElementNS("http://www.w3.org/2000/svg","line");
  cross.setAttribute("y1",geo.T); cross.setAttribute("y2",geo.H-geo.B);
  cross.setAttribute("stroke","var(--dim)"); cross.setAttribute("stroke-width","1"); cross.setAttribute("opacity","0");
  const dot = document.createElementNS("http://www.w3.org/2000/svg","circle");
  dot.setAttribute("r","4.5"); dot.setAttribute("fill","var(--fg)");
  dot.setAttribute("stroke","var(--panel)"); dot.setAttribute("stroke-width","2"); dot.setAttribute("opacity","0");
  svgEl.appendChild(cross); svgEl.appendChild(dot);
  const move = ev => {
    const r = svgEl.getBoundingClientRect();
    const px = (ev.clientX-r.left)/r.width*geo.W;          // viewBox 坐标
    let best=0, bd=1e9;
    rows.forEach((row,i)=>{ const d=Math.abs(geo.X(row[0])-px); if(d<bd){bd=d;best=i;} });
    const row=rows[best], x=geo.X(row[0]), y=geo.Y(row[M.ix]);
    cross.setAttribute("x1",x); cross.setAttribute("x2",x); cross.setAttribute("opacity",".6");
    dot.setAttribute("cx",x); dot.setAttribute("cy",y); dot.setAttribute("opacity","1");
    tt.style.display="block";
    tt.textContent="";
    const b=document.createElement("b"); b.textContent=M.fmt(row[M.ix]);
    const sp=document.createElement("span"); sp.textContent=fmtT(row[0]);
    tt.append(b,sp);
    const wrapW=wrap.clientWidth;
    const pxRatio=(ev.clientX-r.left)/r.width;
    tt.style.left=Math.min(Math.max(pxRatio*wrapW-30,0),wrapW-tt.offsetWidth-4)+"px";
    tt.style.top=(y/geo.H*r.height-tt.offsetHeight-10)+"px";
  };
  const leave = () => { cross.setAttribute("opacity","0"); dot.setAttribute("opacity","0"); tt.style.display="none"; };
  svgEl.addEventListener("pointermove",move);
  svgEl.addEventListener("pointerleave",leave);
}

/* ---------- 渲染 ---------- */
function d24El(d,fmt){
  if(d==null||!isFinite(d)) return `<span class="d24 fl">—</span>`;
  if(Math.abs(d)<1e-9) return `<span class="d24 fl">±0</span>`;
  const up=d>0;
  return `<span class="d24 ${up?"up":"dn"}">${up?"▲":"▼"} ${esc(fmt(Math.abs(d)))}</span>`;
}
function render(){
  const d=S.data; if(!d) return;
  const M=METRICS[S.metric];
  /* 总览条 */
  const tot=(d.vaults||[]).reduce((a,v)=>a+(v.tvl||0),0);
  const tot24=(d.vaults||[]).reduce((a,v)=>a+((v.d24&&v.d24.tvl)||0),0);
  const capTot=(d.vaults||[]).reduce((a,v)=>a+(v.cap||0),0);
  document.getElementById("sum").innerHTML =
    `<div class="tile"><div class="lb">总 TVL(全部 vault)</div><div class="v">${fmtUsd(tot)}</div>
      <div class="d">${d24El(tot24,fmtUsd)} <span style="color:var(--dim)">24h</span></div></div>`+
    `<div class="tile"><div class="lb">总容量 / 使用率</div><div class="v">${fmtUsd(capTot)}</div>
      <div class="d"><span style="color:var(--dim)">cap 合计,当前 ${(tot/capTot*100||0).toFixed(1)}%</span></div></div>`+
    `<div class="tile"><div class="lb">vault 数</div><div class="v">${(d.vaults||[]).length}</div>
      <div class="d"><span style="color:var(--dim)">起采 ${d.since?ago(d.since)+"前":"—"}</span></div></div>`;
  /* 卡片 */
  const grid=document.getElementById("grid");
  const vaults=[...(d.vaults||[])].sort((a,b)=>(a.address<b.address?-1:1));   // 稳定排序→色随实体
  if(!vaults.length){ grid.innerHTML=`<div class="empty">尚无采样数据,首个采样周期后出现(${esc(d.longx_error||"等待 LongXPoller…")})</div>`; return; }
  grid.innerHTML="";
  vaults.forEach((v,i)=>{
    const color=i<SLOTS.length ? SLOTS[i] : "var(--dim)";   // 超出槽位用中性灰,不循环复用
    const card=document.createElement("div"); card.className="card";
    const hist=(d.history&&d.history[v.address])||[];
    const rows=S.range?hist.filter(r=>r[0]>=Date.now()/1e3-S.range):hist;
    const capPct=v.cap_pct==null?null:Math.min(v.cap_pct,999);
    let h=`<div class="chead"><span class="cdot" style="background:${color}"></span>`+
      `<span class="tick">${esc(v.ticker)}</span><span class="cname">${esc(v.name)}</span>`+
      (v.paused?`<span class="bdg pause">⏸ 暂停</span>`:"")+(v.unwound?`<span class="bdg wind">⛔ 已清盘</span>`:"")+`</div>`;
    h+=`<div class="stat"><span class="k">TVL</span><span class="v">${fmtUsd(v.tvl)} ${d24El(v.d24&&v.d24.tvl,fmtUsd)}</span></div>`;
    h+=`<div class="meter" title="容量使用率"><i style="width:${capPct==null?0:Math.min(capPct,100)}%"></i></div>`;
    h+=`<div class="stat"><span class="k">容量 ${fmtUsd(v.cap)}</span><span class="v">${capPct==null?"—":capPct.toFixed(1)+"%"} ${d24El(v.d24&&v.d24.cap,fmtUsd)}</span></div>`;
    h+=`<div class="stat"><span class="k">资金量 supply</span><span class="v">${fmtNum(v.supply)} ${d24El(v.d24&&v.d24.supply,fmtNum)}</span></div>`;
    h+=`<div class="stat"><span class="k">池深度</span><span class="v">${fmtNum(v.pool_liquidity)} ${d24El(v.d24&&v.d24.pool_liquidity,fmtNum)}</span></div>`;
    h+=`<div class="stat"><span class="k">NAV</span><span class="v">${v.nav==null?"—":"$"+v.nav.toFixed(4)}</span></div>`;
    card.innerHTML=h;
    if(S.table){
      const tv=document.createElement("div"); tv.className="tv";
      if(rows.length){
        const tb=document.createElement("table");
        [...rows].reverse().slice(0,60).forEach(r=>{
          const tr=document.createElement("tr");
          const td1=document.createElement("td"); td1.textContent=fmtT(r[0]);
          const td2=document.createElement("td"); td2.textContent=M.fmt(r[M.ix]);
          tr.append(td1,td2); tb.appendChild(tr);
        });
        tv.appendChild(tb);
      } else tv.innerHTML=`<div class="empty">所选范围内无采样</div>`;
      card.appendChild(tv);
    } else {
      const wrap=document.createElement("div"); wrap.className="chartwrap";
      const tt=document.createElement("div"); tt.className="tt";
      if(rows.length===1){
        const g=chartSVG(rows,M,color,S.metric==="tvl"?v.cap:null);
        wrap.innerHTML=g.svg+`<div class="empty" style="padding:2px 0">采样中,折线随数据积累出现</div>`;
      } else if(rows.length>1){
        const g=chartSVG(rows,M,color,S.metric==="tvl"?v.cap:null);
        wrap.innerHTML=g.svg; wrap.appendChild(tt);
        attachHover(wrap,g,rows,M);
      } else {
        wrap.innerHTML=`<div class="empty">所选范围内无采样</div>`;
      }
      card.appendChild(wrap);
    }
    grid.appendChild(card);
  });
}

/* ---------- 刷新(fetch 同值跳过重渲染;失败保留旧渲染) ---------- */
async function refresh(){
  const dot=document.getElementById("dot"), st=document.getElementById("status");
  try{
    const r=await fetch("/api/longx");
    const j=await r.text();
    if(j!==S.lastJson){ S.lastJson=j; S.data=JSON.parse(j); render(); }
    dot.classList.remove("bad");
    document.querySelectorAll(".card.refetch").forEach(c=>c.classList.remove("refetch"));
    const d=S.data;
    st.textContent=d&&d.longx_error ? "采样异常:"+d.longx_error
      : `更新 ${d&&d.longx_at?esc(d.longx_at):"—"} · ${d?(d.vaults||[]).length:0} vaults`;
  }catch(e){
    dot.classList.add("bad");
    st.textContent="网络错误,显示上次数据";
    document.querySelectorAll(".card").forEach(c=>c.classList.add("refetch"));
  }
}
document.getElementById("metric").onchange=e=>{S.metric=e.target.value;render();};
document.getElementById("range").onchange=e=>{S.range=+e.target.value;render();};
document.getElementById("viewChart").onclick=()=>{S.table=false;
  document.getElementById("viewChart").classList.add("on");
  document.getElementById("viewTable").classList.remove("on");render();};
document.getElementById("viewTable").onclick=()=>{S.table=true;
  document.getElementById("viewTable").classList.add("on");
  document.getElementById("viewChart").classList.remove("on");render();};
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
